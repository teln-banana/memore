<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101112" />
    <meta name="description" content="06暗号とかなを相互変換。" />
    <meta name="color-scheme" content="dark" />
    <title>06暗号</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js?v=2"></script>
  </head>
  <body>
    <main class="translator">
      <h1>06暗号</h1>
      <div class="direction">
        <label id="input-label" for="input">暗号</label>
        <button id="swap" class="swap icon-button" type="button" aria-label="変換方向を切り替え" title="変換方向を切り替え">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14m-4-4 4 4-4 4M19 17H5m4-4-4 4 4 4" /></svg>
        </button>
        <label id="output-label" for="output">かな</label>
      </div>
      <div class="editors">
        <section class="editor input-editor" aria-labelledby="input-label">
          <textarea id="input" placeholder="暗号を入力" spellcheck="false" autocapitalize="off" autocomplete="off" aria-labelledby="input-label"></textarea>
          <div class="editor-actions">
            <button id="clear" class="icon-button clear" type="button" aria-label="入力をクリア" title="入力をクリア" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
            </button>
          </div>
        </section>
        <section class="editor output-editor" aria-labelledby="output-label">
          <label class="mobile-output-label" for="output" aria-hidden="true">かな</label>
          <textarea id="output" placeholder="変換結果" spellcheck="false" readonly aria-labelledby="output-label" aria-live="polite" aria-atomic="true"></textarea>
          <div class="editor-actions">
            <button id="copy" class="copy" type="button" aria-label="変換結果をコピー" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="1.6" /><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4" /></svg>
              <span>コピー</span>
            </button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
